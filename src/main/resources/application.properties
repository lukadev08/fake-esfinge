spring.application.name=fake-esfinge
spring.main.banner-mode=off
spring.mvc.log-request-details=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.accesslog.enabled=false
simulator.database=${SIMULATOR_DATABASE:data/simulator.sqlite}
simulator.scenario=cenario-ficticio-a
simulator.profile=2026/V6/6.06
simulator.admin-key=${SIMULATOR_ADMIN_KEY:admin-local-ficticio}
simulator.clock-mode=system
simulator.seed=1
simulator.initial-time=2026-01-01T00:00:00Z
simulator.token-seconds=3600
simulator.users[0].id=usuario-ficticio-a
simulator.users[0].access-code=acesso-ficticio-a
simulator.users[0].password=senha-ficticia-a
simulator.users[0].ugs=0001
